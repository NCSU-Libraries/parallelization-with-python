<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One task, then a thousand</title>
<link rel="stylesheet" href="_shared/anim.css">
<style>
  /* A9: the forest-fire task, and why it matters for parallelization. Every beat says it in words:
     one run is one function call (the card at the top right), and the sweep is many calls that never need each other.
     The data is data/fire-runs.json (burn steps of three 64 x 64 forests), data/sweep.json (1,008 real runs)
     and data/scaling.json (the serial time and the core count). */
  .f-ground { fill: var(--ground); }
  .f-tree   { fill: var(--tree); }
  .forest path, .forest rect { shape-rendering: crispEdges; }     /* cells meet edge to edge: no antialiased seams between them */
  .f-frame  { fill: none; stroke: var(--line); stroke-width: 4; }
  .tile     { opacity: 0; }
  .dot      { opacity: 0; }
  .grid     { stroke: var(--idle); stroke-width: 3; stroke-linecap: round; }
  .grid.base { stroke: var(--overhead); }
  .tick-l   { font: 600 22px var(--font); fill: var(--muted); }
  .axis-t   { font: 600 24px var(--font); fill: var(--muted); }
  .band     { fill: var(--hunt); opacity: 0; }
  .mean-halo { fill: none; stroke: var(--paper); stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
  .mean     { fill: none; stroke: var(--red); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .arrow    { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

  .t { position: absolute; margin: 0; opacity: 0; white-space: nowrap; }

  /* the code card: A1's dark card, at the top right through beats 0 to 3. Its rows are stacked on top of each other
     and fade in and out, so the card keeps one size. */
  .card { position: absolute; left: 712px; top: 110px; width: 520px; height: 128px; background: var(--ink); color: var(--paper); border-radius: 22px; opacity: 0; }
  .card pre { position: absolute; left: 28px; margin: 0; font: 400 24px/1.5 var(--mono); white-space: pre; font-variant-ligatures: none; opacity: 0; }
  .card .fn, .card .ar { color: var(--red-soft); }
  .card b { font-weight: 700; }
  .card pre.cd-tri { font-size: 22px; line-height: 33px; }
  #cdBig  { left: 0; right: 0; top: 34px; text-align: center; font: 700 48px/1.2 var(--mono); }
  .cd-tri .rv { opacity: 0; }                       /* a call's return value appears when it lands */
  .badge { position: absolute; top: -18px; right: 26px; height: 36px; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 18px; font: 700 22px/1 var(--font); color: var(--paper); background: var(--red); opacity: 0; }
  .badge i { display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); }
  .badge.done { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 3px var(--line); }

  .flabel { font: 800 30px/1.1 var(--font); color: var(--ink); text-align: center; width: 256px; }
  .flabel span { color: var(--muted); font-weight: 600; }
  .fcount { font: 700 30px/1.1 var(--font); color: var(--ink); text-align: center; width: 256px; font-variant-numeric: tabular-nums; }
  .fcount b { color: var(--red); font-weight: 800; }

  .small { font: 600 24px/1.2 var(--font); color: var(--muted); }
  #note2 { left: 52px; top: 110px; width: 620px; white-space: normal; font: 600 28px/1.25 var(--font); color: var(--muted); }
  #sp2 { left: 52px; top: 152px; }
  #mzNote { left: 52px; top: 536px; }
  #serial { left: 712px; top: 270px; font-weight: 800; color: var(--red); }
  #serial small { display: block; font: 800 40px/1.2 var(--font); }
  #serial b { display: block; font: 800 88px/1.05 var(--font); letter-spacing: -1px; }

  /* the words that carry each beat, at the bottom: one bold line, or two */
  .cap { position: absolute; left: 52px; right: 48px; bottom: 52px; margin: 0; opacity: 0; }
  .cap.up { bottom: 118px; }
  .cap b { display: block; font: 800 30px/1.2 var(--font); color: var(--ink); }
  .cap span { display: block; margin-top: 4px; font: 600 27px/1.2 var(--font); color: var(--muted); }
  .cap em { font-style: normal; color: var(--red); }
  .banner { position: absolute; left: 48px; right: 48px; bottom: 52px; height: 54px; margin: 0; border-radius: 27px; background: var(--ink); color: var(--paper); font: 800 30px/54px var(--font); text-align: center; opacity: 0; }
  .banner b { color: var(--red-soft); font-weight: 800; }

  #tip { text-align: right; font: 800 34px/1.12 var(--font); color: var(--ink); }
  #tip small { display: block; margin-top: 4px; font: 600 24px/1.2 var(--font); color: var(--muted); }
</style>
</head>
<body>
<main id="stage" class="stage" role="img" aria-label="">
  <h1 class="title">One task, then a thousand</h1>
  <svg class="art" id="art" viewBox="0 0 1280 720" aria-hidden="true"></svg>

  <div class="card" id="card" aria-hidden="true">
    <span class="badge" id="badge"></span>
    <pre class="cd-tri" id="cdTri0" style="top: 14px"></pre>
    <pre class="cd-tri" id="cdTri1" style="top: 47px"></pre>
    <pre class="cd-tri" id="cdTri2" style="top: 80px"></pre>
    <pre id="cdBig"></pre>
  </div>

  <p class="t" id="note2" aria-hidden="true">Three calls. Same seed, three tree densities.</p>
  <p class="t small" id="sp2" aria-hidden="true"></p>
  <p class="t small" id="mzNote" aria-hidden="true">one tile = one call; the darker, the more of the forest burned</p>
  <p class="t" id="serial" aria-hidden="true"><small>One after another:</small><b></b></p>

  <p class="cap" id="cap0" aria-hidden="true"></p>
  <p class="cap" id="cap1" aria-hidden="true"></p>
  <p class="cap" id="cap2" aria-hidden="true"></p>
  <p class="cap" id="cap3" aria-hidden="true"></p>
  <p class="cap up" id="cap4" aria-hidden="true"></p>
  <p class="banner" id="banner" aria-hidden="true"></p>
  <p class="t" id="tip" aria-hidden="true">the tipping point<small></small></p>
</main>

<script src="_shared/anim.js"></script>
<script>
"use strict";
const { svg, html, tok, EASE } = Anim;

// ---- small helpers ----------------------------------------------------------------------------------------------------
const f2 = v => +v.toFixed(2);
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => "#" + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, "0")).join("");
const pctText = p => Math.round(p) + "%";
const fmt = n => n.toLocaleString("en-US");
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const $ = id => document.getElementById(id);
const op = (el, v) => { el.style.opacity = v; el.style.transform = ""; };

const DT = 36;                                  // ms per breadth-first step, in every playback
const FRONT = 3, BURN = 9, ASH_FADE = 3;        // steps a cell stays yellow, then orange; steps it takes to go dark
const LIFE = FRONT + BURN + ASH_FADE;

const art = $("art");
let C;                                          // literal colors for the animations, read from the tokens in setup

// ---- a forest: the base layer is every tree; one overlay per burn step sits on top and changes color -----------------------
function runsOf(cells, size) {                  // [col, row, length] for the cells that pass `keep`, merged along each row
  return keep => {
    const out = [];
    for (let r = 0; r < size; r++) {
      let c = 0;
      while (c < size) {
        if (!keep(cells[r * size + c])) { c++; continue; }
        let e = c;
        while (e + 1 < size && keep(cells[r * size + e + 1])) e++;
        out.push([c, r, e - c + 1]);
        c = e + 1;
      }
    }
    return out;
  };
}
const pathOf = (runs, cell) => runs.map(([c, r, n]) => `M${f2(c * cell)} ${f2(r * cell)}h${f2(n * cell)}v${f2(cell)}h${f2(-n * cell)}z`).join("");

function buildForest(parent, run, cell, ox, oy) {
  const size = run.size, cells = run.cells, side = size * cell;
  const g = svg("g", { class: "forest" }, parent);
  g.style.transform = `translate(${ox}px, ${oy}px)`;
  svg("rect", { class: "f-ground", width: side, height: side }, g);
  svg("path", { class: "f-tree", d: pathOf(runsOf(cells, size)(v => v !== -2), cell) }, g);
  const steps = [];
  const byStep = new Map();                      // burn step -> the cells (row-major indexes) that burn then
  cells.forEach((v, i) => { if (v >= 0) { if (!byStep.has(v)) byStep.set(v, []); byStep.get(v).push(i); } });
  const cum = [];                                // trees burned by the end of step k
  let total = 0;
  for (let k = 0; k <= run.steps; k++) {
    const idx = byStep.get(k) || [];
    total += idx.length;
    cum.push(total);
    if (!idx.length) continue;
    const merged = [];                           // runs of neighbours along a row
    for (const i of idx.sort((a, b) => a - b)) {
      const r = Math.floor(i / size), c = i % size, last = merged[merged.length - 1];
      if (last && last[1] === r && last[0] + last[2] === c) last[2]++; else merged.push([c, r, 1]);
    }
    const path = svg("path", { d: pathOf(merged, cell) }, g);
    path.style.fill = C.tree;
    steps.push({ k, path });
  }
  svg("rect", { class: "f-frame", x: -2, y: -2, width: side + 4, height: side + 4 }, g);
  const trees = cells.reduce((n, v) => n + (v !== -2), 0);
  return { g, run, steps, cum, trees, burned: total, final: 100 * total / trees, side };
}
const startForest = f => f.steps.forEach(s => { s.path.style.fill = C.tree; });
const endForest = f => f.steps.forEach(s => { s.path.style.fill = C.ash; });
const pctAt = (f, k) => 100 * f.cum[Math.min(k, f.cum.length - 1)] / f.trees;

// the color of a burning cell over its life: ignites yellow, burns orange, goes dark
function lifeKeyframes() {
  const t = s => s / LIFE;
  return [
    { fill: C.tree, offset: 0 }, { fill: C.hunt, offset: 0.01 }, { fill: C.hunt, offset: t(FRONT) },
    { fill: C.flame, offset: t(FRONT + 1.5) }, { fill: C.flame, offset: t(FRONT + BURN) }, { fill: C.ash, offset: 1 },
  ];
}
// play a forest: every step's cells change color in turn; returns the time the last cell has gone dark
function burn(f, animate, later, lead, setPct) {
  const kf = lifeKeyframes();
  for (const s of f.steps) animate(s.path, kf, { duration: LIFE * DT, delay: lead + s.k * DT, easing: EASE.linear });
  let last = -1;
  for (let k = 0; k <= f.run.steps; k++) {
    const p = Math.round(pctAt(f, k));
    if (p !== last) { last = p; const v = p; later(lead + k * DT + 10, () => setPct(v)); }
  }
  return lead + (f.run.steps + LIFE) * DT;
}

// ---- setup: draws the page from the data ------------------------------------------------------------------------------------
let trio = [], mosaic = [], sweepInfo, plot = {}, num = {};
const mz = {}, pl = {};                          // the geometry of the mosaic (beat 3) and of the plot (beat 4)
const el = {};                                   // the page's own elements, by name

function setup(ctx, [fireRuns, sweep, scaling]) {
  C = { tree: tok("--tree"), hunt: tok("--hunt"), flame: tok("--flame"), ash: tok("--ash"), ground: tok("--ground"), red: tok("--red") };
  const runs = fireRuns.runs.map(r => Object.assign({ size: fireRuns.size }, r));
  const dens = sweep.densities, per = sweep.seeds_per_density, total = sweep.results.length;
  const rows = {};                                // density -> burned fractions by seed
  for (const [d, seed, fr] of sweep.results) (rows[d] ||= [])[seed] = fr;
  const means = dens.map(d => rows[d].reduce((a, v) => a + v, 0) / rows[d].length);

  // the numbers the words quote, all from the data
  const secs60 = sweep.results.filter(r => Math.abs(r[0] - 0.6) < 1e-9).map(r => r[3]);
  num.ms = 10 * Math.round(median(secs60) * 1000 / 10);        // about 40 ms: the median real time at density 0.60
  num.serial = Math.round(scaling.serial.seconds);             // about 37 s: the whole sweep, one run after another
  num.cores = scaling.machine.cpu_count;
  num.real = sweep.size;                                       // 450: the real forests
  let tip = 0.6;                                               // where the mean curve crosses 50%: the tipping point
  for (let i = 0; i < means.length - 1; i++) if (means[i] < 0.5 && means[i + 1] >= 0.5) tip = dens[i] + (0.5 - means[i]) / (means[i + 1] - means[i]) * (dens[i + 1] - dens[i]);
  num.tip = Math.round(tip * 100);
  sweepInfo = { total, nd: dens.length, per };

  // the card. The code is literally true: burn(density, seed, size=450) in code/fire.py, called here with size=64.
  const tri = r => `<span class="fn">burn</span>(${r.density.toFixed(2)}, ${fireRuns.seed}, size=${fireRuns.size}) <span class="rv"><span class="ar">→</span> <b>${r.burned_fraction.toFixed(2)}</b></span>`;
  for (const id of ["card", "badge", "cdTri0", "cdTri1", "cdTri2", "cdBig", "note2", "sp2", "mzNote", "serial", "banner", "tip"]) el[id] = $(id);
  el.caps = [0, 1, 2, 3, 4].map(i => $("cap" + i));
  el.tri = [0, 1, 2].map(i => $("cdTri" + i));
  runs.slice(0, 3).forEach((r, i) => { el.tri[i].innerHTML = tri(r); });
  num.small = `shown ${fireRuns.size} × ${fireRuns.size}; the real runs are ${num.real} × ${num.real}`;
  el.sp2.textContent = num.small;
  el.serial.querySelector("b").textContent = `about ${num.serial} s`;
  el.banner.innerHTML = `Next: the same ${fmt(total)} runs on <b>${num.cores} cores</b>.`;
  el.tip.querySelector("small").textContent = `near ${num.tip}% trees`;
  el.caps[0].innerHTML = "<b>Three calls: the same simulation at three tree densities.</b>";
  el.caps[1].innerHTML = `<b>It returns one number: the fraction of trees burned.</b><span>The workshop’s runs use ${num.real} × ${num.real} forests: about ${num.ms} ms each.</span>`;
  el.caps[2].innerHTML = "<b>Different inputs, different answers.</b><b>To see the pattern, run it many times.</b>";
  el.caps[3].innerHTML = `<b>${dens.length} densities × ${per} seeds = ${fmt(total)} runs.</b><b>No run needs another’s result: <em>embarrassingly parallel</em>.</b>`;
  el.caps[4].innerHTML = `<b>What the ${fmt(total)} runs are for: fires spread only above about ${num.tip}% trees.</b>`;
  num.callsOf = k => `${fmt(k)} calls`;
  el.cdBig.textContent = num.callsOf(total);

  // beats 0 and 1: the three forests side by side, same seed
  const side = 64 * 4, gap = 140;
  runs.slice(0, 3).forEach((r, i) => {
    const x = 52 + i * (side + gap), y = 282;
    const f = buildForest(art, r, 4, x, y);
    f.g.style.opacity = 0;
    f.top = html("p", { class: "t flabel", html: `<b>${Math.round(r.density * 100)}%</b> <span>trees</span>`, style: { left: x + "px", top: (y - 36) + "px" } }, ctx.stage);
    f.top.querySelector("b").style.fontWeight = 800;
    f.count = html("p", { class: "t fcount", html: "burned: <b>0%</b>", style: { left: x + "px", top: (y + side + 8) + "px" } }, ctx.stage);
    trio.push(f);
  });

  // beat 2: the mosaic, at the left of the card: a tile per run, a column per density
  Object.assign(mz, { x0: 64, y0: 108, colPitch: 29, tileW: 25, rowPitch: 8, tileH: 6 });
  mz.w = dens.length * mz.colPitch - (mz.colPitch - mz.tileW);
  mz.h = per * mz.rowPitch - (mz.rowPitch - mz.tileH);
  mz.colX = i => mz.x0 + mz.tileW / 2 + i * mz.colPitch;
  // beat 3: the same tiles, flown to the plot. Smaller than the first version, to leave room for the words below it.
  Object.assign(pl, { colPitch: 46, fy0: 112, fh: 340 });
  pl.w = dens.length * pl.colPitch - 4;
  pl.x0 = (1280 - pl.w) / 2 + 16;                // a little right of center: the axis labels sit at its left
  pl.colX = i => pl.x0 + 21 + i * pl.colPitch;
  pl.yOf = fr => pl.fy0 + pl.fh - 8 - fr * (pl.fh - 16);

  plot.g = svg("g", {}, art); plot.g.style.opacity = 0;
  plot.grid = [0, 0.5, 1].map(v => svg("line", { class: "grid" + (v === 0 ? " base" : ""), x1: pl.x0 - 12, x2: pl.x0 + pl.w + 12, y1: pl.yOf(v), y2: pl.yOf(v) }, plot.g));
  plot.ylab = [["0%", 0], ["50%", 0.5], ["100%", 1]].map(([t, v]) => svg("text", { class: "tick-l", x: pl.x0 - 24, y: pl.yOf(v), dy: "0.35em", "text-anchor": "end", text: t }, plot.g));
  const mid = pl.fy0 + pl.fh / 2;
  plot.yt = svg("text", { class: "axis-t", x: 78, y: mid, "text-anchor": "middle", transform: `rotate(-90 78 ${mid})`, text: "fraction of trees burned" }, plot.g);
  plot.xt = svg("text", { class: "axis-t", x: 640, y: pl.fy0 + pl.fh + 82, "text-anchor": "middle", text: "tree density" }, plot.g);
  const tipCol = (tip - dens[0]) / (dens[1] - dens[0]);          // the tipping point, as a column number
  plot.bandX = [pl.colX(tipCol - 1), pl.colX(tipCol + 1)];
  plot.band = svg("rect", { class: "band", x: plot.bandX[0], y: pl.fy0 - 6, width: plot.bandX[1] - plot.bandX[0], height: pl.fh + 12, rx: 14 }, art);

  // the density ticks: one set under the mosaic, one under the plot
  const ticks = (colX, y) => {
    const g = svg("g", {}, art); g.style.opacity = 0;
    dens.forEach((d, i) => { if (i % 5 === 0) svg("text", { class: "tick-l", x: colX(i), y, "text-anchor": "middle", text: Math.round(d * 100) + "%" }, g); });
    return g;
  };
  mz.ticks = ticks(mz.colX, mz.y0 + mz.h + 32);
  pl.ticks = ticks(pl.colX, pl.fy0 + pl.fh + 38);

  const gTiles = svg("g", {}, art), gDots = svg("g", {}, art);
  dens.forEach((d, i) => {
    for (let j = 0; j < per; j++) {
      const fr = rows[d][j], col = mix(C.tree, C.ash, fr);
      const cx = mz.colX(i), cy = mz.y0 + mz.tileH / 2 + j * mz.rowPitch;
      const jit = (((j * 0.6180339887 + i * 0.4142135623) % 1) - 0.5) * 26;
      const tile = svg("rect", { class: "tile fb", x: cx - mz.tileW / 2, y: cy - mz.tileH / 2, width: mz.tileW, height: mz.tileH, rx: 2.5 }, gTiles);
      tile.style.fill = col;
      const px = pl.colX(i) + jit, py = pl.yOf(fr);
      const dot = svg("circle", { class: "dot", cx: px, cy: py, r: 5.5 }, gDots);
      dot.style.fill = col;
      const rec = { tile, dot, i, j, fr, cx, cy, px, py };
      rec.fly = `translate(${f2(px - cx)}px, ${f2(py - cy)}px) scale(${f2(11 / mz.tileW)}, ${f2(11 / mz.tileH)})`;
      mosaic.push(rec);
    }
  });

  // the mean line through the means of the columns
  const pts = means.map((m, i) => ({ x: pl.colX(i), y: pl.yOf(m) }));
  const d = monotone(pts);
  plot.halo = svg("path", { class: "mean-halo", d }, art);
  plot.mean = svg("path", { class: "mean", d }, art);
  plot.len = plot.mean.getTotalLength();
  for (const p of [plot.halo, plot.mean]) p.style.strokeDasharray = plot.len;
  plot.arrow = svg("path", { class: "arrow", d: `M${plot.bandX[0] - 62} 238 H${plot.bandX[0] - 14} M${plot.bandX[0] - 30} 222 L${plot.bandX[0] - 12} 238 L${plot.bandX[0] - 30} 254` }, art);
  el.tip.style.left = (plot.bandX[0] - 82 - 360) + "px";           // right-aligned in a 360 px box, ending 82 px before the band
  el.tip.style.width = "360px";
  el.tip.style.top = "190px";

  // the text alternatives, one sentence per beat, with every number from the data
  const pc = r => Math.round(r.density * 100), fr2 = r => r.burned_fraction.toFixed(2);
  const three = runs.slice(0, 3), list = a => a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  DEF.alt = [
    `Three forests ${fireRuns.size} cells across, with ${list(three.map(pc))} percent trees, stand unburned above a code card with three calls of burn with the same seed and the three densities.`,
    `The three fires burn together and the calls return ${list(three.map(fr2))}, so different inputs give different answers and seeing the pattern means running it many times; one run takes about ${num.ms} milliseconds at the workshop's real ${num.real} by ${num.real} size.`,
    `The sweep is ${dens.length} densities times ${per} seeds, ${fmt(total)} calls drawn as tiles with one column per density, and because no call needs another's result it is embarrassingly parallel and takes about ${num.serial} seconds one after another.`,
    `The tiles become dots on a plot of the fraction of trees burned against tree density, with a red mean line that rises steeply at the tipping point near ${num.tip}% trees, and a banner says the same ${fmt(total)} runs come next on ${num.cores} cores.`,
  ];
}

// a smooth curve through the points that never overshoots them (a monotone cubic)
function monotone(p) {
  const n = p.length, dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1].x - p[i].x; m[i] = (p[i + 1].y - p[i].y) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (3 * (dx[i - 1] + dx[i])) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = `M${f2(p[0].x)} ${f2(p[0].y)}`;
  for (let i = 0; i < n - 1; i++) d += `C${f2(p[i].x + dx[i] / 3)} ${f2(p[i].y + (t[i] * dx[i]) / 3)} ${f2(p[i + 1].x - dx[i] / 3)} ${f2(p[i + 1].y - (t[i + 1] * dx[i]) / 3)} ${f2(p[i + 1].x)} ${f2(p[i + 1].y)}`;
  return d;
}

// ---- states -------------------------------------------------------------------------------------------------------------------
const setTrio = (i, p) => { trio[i].count.innerHTML = `burned: <b>${pctText(p)}</b>`; };
function setBadge(state) {                       // "running", "done", or nothing
  el.badge.className = "badge " + state;
  el.badge.innerHTML = state === "running" ? "<i></i>running" : "done";
}
const rvs = () => el.tri.map(r => r.querySelector(".rv"));

const CAP = [0, 2, 3, 4];                        // the caption element each beat uses

const DEF = {
  beats: 3,
  alt: [],                                       // filled in by setup, from the data

  load: () => Promise.all([Anim.loadJSON("data/fire-runs.json"), Anim.loadJSON("data/sweep.json"), Anim.loadJSON("data/scaling.json")]),
  setup,

  render(beat) {
    const n = beat === 0 ? 2 : beat + 1;           // the old numbering of this page: 2 the three forests, 3 the mosaic, 4 the plot
    const T = sweepInfo.total;
    // the card
    op(el.card, n <= 3 ? 1 : 0);
    el.tri.forEach(r => op(r, n === 2 ? 1 : 0));
    rvs().forEach(r => op(r, beat === 0 ? 0 : 1));
    op(el.cdBig, n === 3 ? 1 : 0);
    el.cdBig.textContent = num.callsOf(T);
    setBadge(beat === 1 ? "done" : "");
    op(el.badge, beat === 1 ? 1 : 0);
    // three forests
    trio.forEach((f, i) => {
      f.g.style.opacity = n === 2 ? 1 : 0;
      (beat === 1 ? endForest : startForest)(f);
      op(f.top, n === 2 ? 1 : 0);
      op(f.count, n === 2 ? 1 : 0);
      setTrio(i, beat === 1 ? f.final : 0);
    });
    op(el.note2, n === 2 ? 1 : 0);
    op(el.sp2, n === 2 ? 1 : 0);
    // the sweep
    for (const r of mosaic) {
      r.tile.style.opacity = n === 3 ? 1 : 0; r.tile.style.transform = "";
      r.dot.style.opacity = n === 4 ? 0.5 : 0;
    }
    op(mz.ticks, n === 3 ? 1 : 0);
    op(el.mzNote, n === 3 ? 1 : 0);
    op(el.serial, n === 3 ? 1 : 0);
    op(pl.ticks, n === 4 ? 1 : 0);
    op(plot.g, n === 4 ? 1 : 0);
    op(plot.band, n === 4 ? 0.28 : 0);
    for (const p of [plot.halo, plot.mean]) { p.style.strokeDashoffset = 0; p.style.opacity = n === 4 ? (p === plot.halo ? 0.85 : 1) : 0; }
    op(plot.arrow, n === 4 ? 1 : 0);
    op(el.tip, n === 4 ? 1 : 0);
    // the words
    el.caps.forEach((c, i) => op(c, i === CAP[beat] ? 1 : 0));
    op(el.banner, n === 4 ? 1 : 0);
  },

  enter(beat, { animate, later }) {
    const n = beat + 1;                          // the old numbering: 2 the burn, 3 the mosaic, 4 the plot
    const fade = (a, b) => [{ opacity: a }, { opacity: b }];
    const rise = y => [{ opacity: 0, transform: `translateY(${y}px)` }, { opacity: 1, transform: "translateY(0)" }];
    const out = (els, ms = 400) => els.forEach(e => animate(e, fade(1, 0), { duration: ms }));
    const words = () => { animate(el.caps[CAP[beat - 1]], fade(1, 0), { duration: 350 }); animate(el.caps[CAP[beat]], rise(10), { duration: 550, delay: 250 }); };

    if (n === 2) {
      words();
      setBadge("running");
      animate(el.badge, fade(0, 1), { duration: 400, delay: 200 });
      let last = 0;
      trio.forEach((f, i) => {
        startForest(f);
        setTrio(i, 0);
        burn(f, animate, later, 400, p => setTrio(i, p));
        // a call lands on its own time: when its fire has spread as far as it will
        const t = 400 + f.run.steps * DT + 120;
        animate(rvs()[i], fade(0, 1), { duration: 450, delay: t });
        last = Math.max(last, t);
      });
      later(last + 250, () => setBadge("done"));
    }

    if (n === 3) {
      for (const f of trio) out([f.g, f.top, f.count], 450);
      out([el.note2, el.sp2, el.badge, ...el.tri]);
      words();
      // the card counts the calls as the tiles arrive, a column at a time
      el.cdBig.textContent = num.callsOf(0);
      animate(el.cdBig, fade(0, 1), { duration: 400, delay: 400 });
      const nd = sweepInfo.nd, per = sweepInfo.per;
      for (let i = 0; i < nd; i++) later(500 + i * 62 + 250, () => { el.cdBig.textContent = num.callsOf((i + 1) * per); });
      animate(mz.ticks, fade(0, 1), { duration: 600, delay: 600 });
      for (const r of mosaic) animate(r.tile, [{ opacity: 0, transform: "scale(0.35)" }, { opacity: 1, transform: "scale(1)" }], { duration: 320, delay: 500 + r.i * 62 + r.j * 4, easing: EASE.out });
      const done = 500 + (nd - 1) * 62 + (per - 1) * 4 + 320;
      animate(el.mzNote, rise(10), { duration: 500, delay: done });
      animate(el.serial, rise(12), { duration: 600, delay: done + 200 });
    }

    if (n === 4) {
      out([el.card, el.mzNote, el.serial, mz.ticks]);
      words();
      animate(plot.g, fade(0, 1), { duration: 700, delay: 250 });
      animate(pl.ticks, fade(0, 1), { duration: 600, delay: 600 });
      // each tile flies to its place on the curve (fraction burned up, a little jitter sideways) and becomes a dot
      for (const r of mosaic) {
        const d = r.i * 22 + (r.j % 7) * 10;
        animate(r.tile, [{ opacity: 1, transform: "none" }, { opacity: 1, transform: r.fly, offset: 0.78 }, { opacity: 0, transform: r.fly }], { duration: 1100, delay: 200 + d, easing: EASE.inOut });
        animate(r.dot, [{ opacity: 0 }, { opacity: 0, offset: 0.78 }, { opacity: 0.5 }], { duration: 1100, delay: 200 + d, easing: EASE.inOut });
      }
      const t = 1900;
      animate(plot.halo, [{ strokeDashoffset: plot.len, opacity: 0.85 }, { strokeDashoffset: 0, opacity: 0.85 }], { duration: 1300, delay: t, easing: EASE.inOut });
      animate(plot.mean, [{ strokeDashoffset: plot.len, opacity: 1 }, { strokeDashoffset: 0, opacity: 1 }], { duration: 1300, delay: t, easing: EASE.inOut });
      animate(plot.band, fade(0, 0.28), { duration: 600, delay: t + 1300 });
      animate(plot.arrow, rise(0), { duration: 500, delay: t + 1700 });
      animate(el.tip, rise(10), { duration: 600, delay: t + 1700 });
      animate(el.banner, rise(12), { duration: 600, delay: t + 2300 });
    }
  },
};
defineAnimation(DEF);
</script>
</body>
</html>
