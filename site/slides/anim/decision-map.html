<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your decision: two questions</title>
<link rel="stylesheet" href="_shared/anim.css">
<style>
  /* A6: the decision map, built on the two questions. A table that grows one row at a time: what do you split, how often
     do the pieces talk, and what to reach for. Row 1 is today's choice, in red; the other rows are gray.
     Three side checks come under the table, then the caption. */
  #layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  .n { position: absolute; margin: 0; opacity: 0; display: flex; flex-direction: column; justify-content: center; }

  .head { background: var(--ink); color: var(--paper); border-radius: 20px; align-items: center; text-align: center; padding: 0 14px; font: 800 24px/1.14 var(--font); text-wrap: balance; }

  .cell      { background: var(--paper); border: 4px solid var(--overhead); border-radius: 18px; align-items: center; text-align: center; padding: 0 16px; font: 700 26px/1.14 var(--font); color: var(--ink); }
  .cell.talk { font-weight: 600; }
  .cell.hot  { border-color: var(--red); background: color-mix(in srgb, var(--red) 8%, var(--paper)); }

  .card      { background: var(--idle); border: 3px solid var(--overhead); border-radius: 14px; padding: 0 20px; font: 600 24px/1.2 var(--font); color: var(--ink); }
  .card code { font: 700 24px/1.2 var(--mono); }
  .card .l2  { font: 400 22px/1.2 var(--font); }
  .card.pool { background: var(--red); border-color: var(--red-deep); color: var(--paper); flex-direction: row; align-items: center; justify-content: space-between; }
  .today { flex: none; padding: 0 14px; border-radius: 17px; background: var(--paper); color: var(--red); font: 800 22px/34px var(--font); font-style: normal; opacity: 0; }

  .ar     { fill: none; stroke: var(--overhead); stroke-width: 5; stroke-dasharray: 1; }
  .ah     { fill: var(--overhead); }
  .ar.hot { stroke: var(--red); }
  .ah.hot { fill: var(--red); }

  .check   { background: var(--paper); border: 3px dashed var(--overhead); border-radius: 14px; padding: 0 18px; font: 400 24px/1.2 var(--font); color: var(--ink); text-wrap: balance; }
  .check b { font: 800 24px/1.2 var(--font); }

  .caption { align-items: center; text-align: center; font: 800 40px/1.18 var(--font); color: var(--red); }
</style>
</head>
<body>
<main id="stage" class="stage" role="img" aria-label="">
  <h1 class="title">Your decision: two questions</h1>
  <svg class="art" id="art" viewBox="0 0 1280 720" aria-hidden="true"></svg>
  <div id="layer" aria-hidden="true"></div>
</main>

<script src="_shared/anim.js"></script>
<script>
"use strict";
const { svg, EASE } = Anim;
const $ = id => document.getElementById(id);
const art = $("art"), layer = $("layer");

// ---- geometry (stage pixels) ------------------------------------------------------------------------------------------
const X0 = 48, X1 = 1232, GAP = 44;                    // the table fills the margins; each gap holds an arrow
const COLW = [206, 282, 0], COLX = [X0, 0, 0];
COLX[1] = COLX[0] + COLW[0] + GAP;
COLX[2] = COLX[1] + COLW[1] + GAP;
COLW[2] = X1 - COLX[2];                                // the tools column takes what is left
const HEAD_Y = 98, HEAD_H = 60;
const ROW_Y = [170, 246, 322, 398], ROW_H = 68;
const CHECK = { y: 486, h: 104, w: 384, gap: 16 };     // three side checks fill the width
const CAP = { x: 300, y: 612, w: 680, h: 48 };         // centered, and clear of the slide number at the bottom left

function box(cls, x, y, w, h, inner) {
  const d = document.createElement("div");
  d.className = "n " + cls;
  Object.assign(d.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  d.innerHTML = inner;
  layer.appendChild(d);
  return d;
}

// A horizontal arrow across a gap, from one cell to the next. pathLength 1 lets one dash offset draw the line.
function arrow(xa, xb, y, hot) {
  const x1 = xa + 5, tip = xb - 4, L = 16, W = 11, bx = tip - L, c = hot ? " hot" : "";
  return {
    line: svg("path", { class: "ar" + c, d: `M${x1},${y} L${bx + 1},${y}`, pathLength: 1 }, art),
    head: svg("path", { class: "ah" + c, d: `M${tip},${y} L${bx},${y + W} L${bx},${y - W} Z` }, art),
  };
}

// ---- the table ----------------------------------------------------------------------------------------------------------
const ROWS = [
  { split: "the inputs", talk: "never", hot: true,
    reach: '<span><code>multiprocessing.Pool</code></span><i class="today">today</i>' },
  { split: "the data", talk: "once, at the end",
    reach: '<span><code>Pool.map</code>, then combine</span><span class="l2">for data bigger than memory, Dask DataFrame</span>' },
  { split: "the space", talk: "every step",
    reach: '<span>MPI (<code>mpi4py</code>), Dask’s <code>map_overlap</code></span>' },
  { split: "the steps", talk: "at each handoff",
    reach: '<span>queues, Dask, workflow tools</span>' },
];

const heads = ["What do you split?", "How often do the pieces talk?", "Reach for"]
  .map((t, i) => box("head", COLX[i], HEAD_Y, COLW[i], HEAD_H, t));

const rows = ROWS.map((r, i) => {
  const y = ROW_Y[i], mid = y + ROW_H / 2, hot = !!r.hot, h = hot ? " hot" : "";
  const row = {
    split: box("cell" + h, COLX[0], y, COLW[0], ROW_H, r.split),
    talk: box("cell talk" + h, COLX[1], y, COLW[1], ROW_H, r.talk),
    reach: box("card" + (hot ? " pool" : ""), COLX[2], y, COLW[2], ROW_H, r.reach),
    a1: arrow(COLX[0] + COLW[0], COLX[1], mid, hot),
    a2: arrow(COLX[1] + COLW[1], COLX[2], mid, hot),
  };
  row.tag = row.reach.querySelector(".today");           // only today's row has one
  return row;
});

const checks = [
  ["Mostly waiting for the network or disk?", "→ threads or asyncio"],
  ["Already NumPy-shaped?", "→ vectorize first"],
  ["Bigger than one machine?", "→ a cluster"],
].map(([q, a], i) => box("check", X0 + i * (CHECK.w + CHECK.gap), CHECK.y, CHECK.w, CHECK.h, `<span>${q}</span><b>${a}</b>`));

const caption = box("caption", CAP.x, CAP.y, CAP.w, CAP.h, "Where did your task land?");

// ---- what is on screen at each beat -----------------------------------------------------------------------------------
const arr = a => [a.line, a.head];
const parts = [                                          // {els, from: the first beat that shows them}
  { els: heads, from: 0 },
  ...rows.map((r, i) => ({ els: [r.split, r.talk, r.reach, ...arr(r.a1), ...arr(r.a2), ...(r.tag ? [r.tag] : [])], from: i + 1 })),
  { els: checks, from: 5 },
  { els: [caption], from: 6 },
];

const set = (el, v) => { el.style.opacity = v; el.style.transform = ""; };

defineAnimation({
  beats: 6,
  alt: [
    "Three column heads read: What do you split, How often do the pieces talk, and Reach for.",
    "Row one, in red: split the inputs, the pieces never talk, and you reach for multiprocessing.Pool, which is today's choice.",
    "Row two: split the data, the pieces talk once at the end, and you reach for Pool.map and then combine, or Dask DataFrame when the data is bigger than memory.",
    "Row three: split the space, the pieces talk every step, and you reach for MPI with mpi4py, or Dask's map_overlap.",
    "Row four: split the steps, the pieces talk at each handoff, and you reach for queues, Dask or workflow tools.",
    "Three side checks appear under the table: mostly waiting for the network or disk means threads or asyncio, already NumPy-shaped means vectorize first, and bigger than one machine means a cluster.",
    "The full table stays on screen with row one in red, and the caption asks: Where did your task land?",
  ],

  render(n) {
    for (const p of parts) for (const el of p.els) set(el, n >= p.from ? 1 : 0);
  },

  enter(n, { animate }) {
    const rise = (el, delay, dx = 0, dy = 14, dur = 500) =>
      animate(el, [{ opacity: 0, transform: `translate(${dx}px, ${dy}px)` }, { opacity: 1, transform: "translate(0px, 0px)" }], { delay, duration: dur });
    const pop = (el, delay, dur = 450, from = 0.7) =>
      animate(el, [{ opacity: 0, transform: `scale(${from})` }, { opacity: 1, transform: "scale(1)" }], { delay, duration: dur, easing: EASE.pop });
    const draw = (a, delay, dur = 400) => {              // the line grows from its start; the head lands as it arrives
      animate(a.line, [{ opacity: 1, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0 }], { delay, duration: dur, easing: EASE.inOut });
      animate(a.head, [{ opacity: 0 }, { opacity: 1 }], { delay: delay + dur - 100, duration: 400 });
    };

    if (n >= 1 && n <= 4) {                              // one row: the split, the talk, then the tools, left to right
      const r = rows[n - 1];
      rise(r.split, 0);
      draw(r.a1, 250);
      rise(r.talk, 450, -20, 0);
      draw(r.a2, 800);
      if (r.tag) { pop(r.reach, 1000, 600, 0.85); pop(r.tag, 1500); }   // today's row lands in red
      else rise(r.reach, 1000, -20, 0, 550);
    }
    if (n === 5) checks.forEach((el, i) => rise(el, i * 400, 0, 16));
    if (n === 6) rise(caption, 0, 0, 12, 600);
  },
});
</script>
</body>
</html>
